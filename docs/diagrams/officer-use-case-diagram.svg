<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="100%" height="100%" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12" />
    </filter>
    
    <!-- Open Arrow Marker for Include/Extend -->
    <marker id="arrowInc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#D9383A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrowExt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#D39E00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="40" y="35" font-size="20" font-weight="bold" fill="#001A4D">STI Sync Web — Organization Officer Use Case Diagram</text>
  <text x="40" y="55" font-size="12" fill="#666666">UML 2.5 Use Case Diagram Standard (Actors, Associations, &lt;&lt;include&gt;&gt;, &lt;&lt;extend&gt;&gt;)</text>

  <!-- System Boundary Box -->
  <rect x="220" y="70" width="890" height="720" rx="8" ry="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="0" />
  <rect x="220" y="70" width="890" height="32" rx="8" ry="8" fill="#E2E8F0" />
  <text x="235" y="92" font-size="13" font-weight="bold" fill="#334155">STI Sync Web — Organization Officer Use Case Diagram — System Boundary</text>

  <!-- Actor Stick Figure & Label -->
  <g transform="translate(45, 330)">
    <!-- Head -->
    <circle cx="50" cy="30" r="18" fill="#E1D5E7" stroke="#1E293B" stroke-width="2.5" />
    <!-- Body -->
    <line x1="50" y1="48" x2="50" y2="105" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
    <!-- Arms -->
    <line x1="15" y1="70" x2="85" y2="70" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
    <!-- Left Leg -->
    <line x1="50" y1="105" x2="22" y2="155" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
    <!-- Right Leg -->
    <line x1="50" y1="105" x2="78" y2="155" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
    <!-- Actor Label -->
    <text x="50" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Organization Officer</text>
  </g>

  <!-- Association Lines (Actor to Base Cases) -->
  <g stroke="#334155" stroke-width="1.8">
    <line x1="110" y1="400" x2="260" y2="137" />
    <line x1="110" y1="400" x2="260" y2="207" />
    <line x1="110" y1="400" x2="260" y2="282" />
    <line x1="110" y1="400" x2="260" y2="357" />
    <line x1="110" y1="400" x2="260" y2="432" />
    <line x1="110" y1="400" x2="260" y2="507" />
    <line x1="110" y1="400" x2="260" y2="582" />
    <line x1="110" y1="400" x2="260" y2="657" />
    <line x1="110" y1="400" x2="260" y2="732" />
  </g>

  <!-- Include Links (Base Cases to Included Cases) -->
  <g stroke="#D9383A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowInc)">
    <line x1="460" y1="207" x2="590" y2="180" />
    <line x1="460" y1="207" x2="590" y2="240" />
    <line x1="460" y1="357" x2="590" y2="355" />
    <line x1="460" y1="432" x2="590" y2="430" />
    <line x1="460" y1="582" x2="590" y2="580" />
    <line x1="460" y1="657" x2="590" y2="655" />
  </g>
  <g font-size="11" font-weight="bold" fill="#D9383A" text-anchor="middle">
    <text x="525" y="188.5">&lt;&lt;include&gt;&gt;</text>
    <text x="525" y="218.5">&lt;&lt;include&gt;&gt;</text>
    <text x="525" y="351">&lt;&lt;include&gt;&gt;</text>
    <text x="525" y="426">&lt;&lt;include&gt;&gt;</text>
    <text x="525" y="576">&lt;&lt;include&gt;&gt;</text>
    <text x="525" y="651">&lt;&lt;include&gt;&gt;</text>
  </g>

  <!-- Extend Links (Extending Cases to Base Cases) -->
  <g stroke="#D39E00" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowExt)">
    <line x1="590" y1="295" x2="460" y2="282" />
    <line x1="590" y1="505" x2="460" y2="507" />
    <line x1="860" y1="580" x2="460" y2="582" />
  </g>
  <g font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">
    <text x="525" y="283.5">&lt;&lt;extend&gt;&gt;</text>
    <text x="525" y="501">&lt;&lt;extend&gt;&gt;</text>
    <text x="660" y="576">&lt;&lt;extend&gt;&gt;</text>
  </g>

  <!-- Base Use Cases (Blue Ovals) -->
  <g filter="url(#dropShadow)">
    
    <g transform="translate(260, 110)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Log In to Officer Portal</tspan>
      </text>
    </g>
    <g transform="translate(260, 180)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Create Event Proposal</tspan>
      </text>
    </g>
    <g transform="translate(260, 255)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Manage Member Directory</tspan>
      </text>
    </g>
    <g transform="translate(260, 330)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Generate Member Dues</tspan><tspan x="100" dy="15">& Payables</tspan>
      </text>
    </g>
    <g transform="translate(260, 405)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Record Cash Payment</tspan>
      </text>
    </g>
    <g transform="translate(260, 480)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Control QR Ticket</tspan><tspan x="100" dy="15">Gate Status</tspan>
      </text>
    </g>
    <g transform="translate(260, 555)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Submit Financial Liquidation</tspan>
      </text>
    </g>
    <g transform="translate(260, 630)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Request & Generate</tspan><tspan x="100" dy="15">Certificates</tspan>
      </text>
    </g>
    <g transform="translate(260, 705)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Post Announcements</tspan>
      </text>
    </g>
  </g>

  <!-- Included Use Cases (Pink/Red Ovals) -->
  <g filter="url(#dropShadow)">
    
    <g transform="translate(590, 155)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#F8CECC" stroke="#D9383A" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#900C3F">
        <tspan x="95" dy="0">Auto-Bind Active</tspan><tspan x="95" dy="14">Hosting Organization</tspan>
      </text>
    </g>
    <g transform="translate(590, 215)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#F8CECC" stroke="#D9383A" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#900C3F">
        <tspan x="95" dy="0">Assign Scanners from</tspan><tspan x="95" dy="14">Club Officer Roster</tspan>
      </text>
    </g>
    <g transform="translate(590, 330)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#F8CECC" stroke="#D9383A" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#900C3F">
        <tspan x="95" dy="0">Batch Generate</tspan><tspan x="95" dy="14">Payable Documents</tspan>
      </text>
    </g>
    <g transform="translate(590, 405)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#F8CECC" stroke="#D9383A" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#900C3F">
        <tspan x="95" dy="0">Unlock Student Mobile</tspan><tspan x="95" dy="14">QR Ticket in Real-Time</tspan>
      </text>
    </g>
    <g transform="translate(590, 555)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#F8CECC" stroke="#D9383A" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#900C3F">
        <tspan x="95" dy="0">Upload Receipts to</tspan><tspan x="95" dy="14">Cloudinary Storage</tspan>
      </text>
    </g>
    <g transform="translate(590, 630)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#F8CECC" stroke="#D9383A" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#900C3F">
        <tspan x="95" dy="0">Filter Verified Present</tspan><tspan x="95" dy="14">Attendees Only</tspan>
      </text>
    </g>
  </g>

  <!-- Extended Use Cases (Yellow/Amber Ovals) -->
  <g filter="url(#dropShadow)">
    
    <g transform="translate(590, 270)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#FFF2CC" stroke="#D39E00" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#856404">
        <tspan x="95" dy="0">Appoint / Promote Member</tspan><tspan x="95" dy="14">to Officer Position</tspan>
      </text>
    </g>
    <g transform="translate(590, 480)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#FFF2CC" stroke="#D39E00" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#856404">
        <tspan x="95" dy="0">Manual Gate Ticket</tspan><tspan x="95" dy="14">Override Unlock</tspan>
      </text>
    </g>
    <g transform="translate(860, 555)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#FFF2CC" stroke="#D39E00" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#856404">
        <tspan x="95" dy="0">Resubmit Revised</tspan><tspan x="95" dy="14">Liquidation Report</tspan>
      </text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 725)">
    <rect x="0" y="0" width="160" height="65" rx="5" ry="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <ellipse cx="20" cy="18" rx="10" ry="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5" />
    <text x="38" y="22" font-size="10" font-weight="bold" fill="#001A4D">Base Use Case</text>
    <ellipse cx="20" cy="35" rx="10" ry="6" fill="#F8CECC" stroke="#D9383A" stroke-width="1.5" />
    <text x="38" y="39" font-size="10" fill="#900C3F">&lt;&lt;include&gt;&gt; Case</text>
    <ellipse cx="20" cy="52" rx="10" ry="6" fill="#FFF2CC" stroke="#D39E00" stroke-width="1.5" />
    <text x="38" y="56" font-size="10" fill="#856404">&lt;&lt;extend&gt;&gt; Case</text>
  </g>
</svg>