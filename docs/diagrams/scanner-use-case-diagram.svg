<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="100%" height="100%" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12" />
    </filter>
    
    <!-- Open Arrow Marker for Include/Extend -->
    <marker id="arrowInc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#D9383A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrowExt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#D39E00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="40" y="35" font-size="20" font-weight="bold" fill="#001A4D">STI Sync Mobile — Student Scanner Officer Use Case Diagram</text>
  <text x="40" y="55" font-size="12" fill="#666666">UML 2.5 Use Case Diagram Standard (Actors, Associations, &lt;&lt;include&gt;&gt;, &lt;&lt;extend&gt;&gt;)</text>

  <!-- System Boundary Box -->
  <rect x="220" y="70" width="890" height="720" rx="8" ry="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="0" />
  <rect x="220" y="70" width="890" height="32" rx="8" ry="8" fill="#E2E8F0" />
  <text x="235" y="92" font-size="13" font-weight="bold" fill="#334155">STI Sync Mobile — Student Scanner Officer Use Case Diagram — System Boundary</text>

  <!-- Actor Stick Figure & Label -->
  <g transform="translate(45, 330)">
    <!-- Head -->
    <circle cx="50" cy="30" r="18" fill="#FFE6CC" stroke="#1E293B" stroke-width="2.5" />
    <!-- Body -->
    <line x1="50" y1="48" x2="50" y2="105" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
    <!-- Arms -->
    <line x1="15" y1="70" x2="85" y2="70" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
    <!-- Left Leg -->
    <line x1="50" y1="105" x2="22" y2="155" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
    <!-- Right Leg -->
    <line x1="50" y1="105" x2="78" y2="155" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
    <!-- Actor Label -->
    <text x="50" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Student Scanner Officer</text>
  </g>

  <!-- Association Lines (Actor to Base Cases) -->
  <g stroke="#334155" stroke-width="1.8">
    <line x1="110" y1="400" x2="260" y2="147" />
    <line x1="110" y1="400" x2="260" y2="247" />
    <line x1="110" y1="400" x2="260" y2="357" />
    <line x1="110" y1="400" x2="260" y2="487" />
    <line x1="110" y1="400" x2="260" y2="597" />
    <line x1="110" y1="400" x2="260" y2="707" />
  </g>

  <!-- Include Links (Base Cases to Included Cases) -->
  <g stroke="#D9383A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowInc)">
    <line x1="460" y1="147" x2="590" y2="145" />
    <line x1="460" y1="357" x2="590" y2="315" />
    <line x1="460" y1="357" x2="590" y2="375" />
    <line x1="460" y1="357" x2="590" y2="435" />
    <line x1="460" y1="707" x2="590" y2="705" />
  </g>
  <g font-size="11" font-weight="bold" fill="#D9383A" text-anchor="middle">
    <text x="525" y="141">&lt;&lt;include&gt;&gt;</text>
    <text x="525" y="331">&lt;&lt;include&gt;&gt;</text>
    <text x="525" y="361">&lt;&lt;include&gt;&gt;</text>
    <text x="525" y="391">&lt;&lt;include&gt;&gt;</text>
    <text x="525" y="701">&lt;&lt;include&gt;&gt;</text>
  </g>

  <!-- Extend Links (Extending Cases to Base Cases) -->
  <g stroke="#D39E00" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowExt)">
    <line x1="860" y1="375" x2="460" y2="357" />
    <line x1="590" y1="485" x2="460" y2="487" />
    <line x1="860" y1="705" x2="460" y2="707" />
  </g>
  <g font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">
    <text x="660" y="361">&lt;&lt;extend&gt;&gt;</text>
    <text x="525" y="481">&lt;&lt;extend&gt;&gt;</text>
    <text x="660" y="701">&lt;&lt;extend&gt;&gt;</text>
  </g>

  <!-- Base Use Cases (Blue Ovals) -->
  <g filter="url(#dropShadow)">
    
    <g transform="translate(260, 120)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Authenticate & Open</tspan><tspan x="100" dy="15">Scanner Mode</tspan>
      </text>
    </g>
    <g transform="translate(260, 220)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Pre-Cache Event Roster</tspan><tspan x="100" dy="15">to SQLite (Drift)</tspan>
      </text>
    </g>
    <g transform="translate(260, 330)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Scan QR Ticket</tspan><tspan x="100" dy="15">via Camera</tspan>
      </text>
    </g>
    <g transform="translate(260, 460)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Record Manual / Flagged</tspan><tspan x="100" dy="15">Attendance Entry</tspan>
      </text>
    </g>
    <g transform="translate(260, 570)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">View Real-Time Gate</tspan><tspan x="100" dy="15">Attendance Logs</tspan>
      </text>
    </g>
    <g transform="translate(260, 680)">
      <ellipse cx="100" cy="27" rx="100" ry="27" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
      <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">
        <tspan x="100" dy="0">Synchronize Data</tspan><tspan x="100" dy="15">with Cloud Firestore</tspan>
      </text>
    </g>
  </g>

  <!-- Included Use Cases (Pink/Red Ovals) -->
  <g filter="url(#dropShadow)">
    
    <g transform="translate(590, 120)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#F8CECC" stroke="#D9383A" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#900C3F">
        <tspan x="95" dy="0">Validate Scanner Role</tspan><tspan x="95" dy="14">& Session Permissions</tspan>
      </text>
    </g>
    <g transform="translate(590, 290)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#F8CECC" stroke="#D9383A" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#900C3F">
        <tspan x="95" dy="0">Execute 6-Step Validation</tspan><tspan x="95" dy="14">Pipeline</tspan>
      </text>
    </g>
    <g transform="translate(590, 350)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#F8CECC" stroke="#D9383A" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#900C3F">
        <tspan x="95" dy="0">Evaluate Grace Period</tspan><tspan x="95" dy="14">& Late Status</tspan>
      </text>
    </g>
    <g transform="translate(590, 410)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#F8CECC" stroke="#D9383A" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#900C3F">
        <tspan x="95" dy="0">Save Offline Attendance</tspan><tspan x="95" dy="14">Record to SQLite</tspan>
      </text>
    </g>
    <g transform="translate(590, 680)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#F8CECC" stroke="#D9383A" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#900C3F">
        <tspan x="95" dy="0">Batch Upload Unsynced</tspan><tspan x="95" dy="14">SQLite Records</tspan>
      </text>
    </g>
  </g>

  <!-- Extended Use Cases (Yellow/Amber Ovals) -->
  <g filter="url(#dropShadow)">
    
    <g transform="translate(860, 350)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#FFF2CC" stroke="#D39E00" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#856404">
        <tspan x="95" dy="0">Display Visual Result Overlay</tspan><tspan x="95" dy="14">(Present/Late/Duplicate/Closed)</tspan>
      </text>
    </g>
    <g transform="translate(590, 460)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#FFF2CC" stroke="#D39E00" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#856404">
        <tspan x="95" dy="0">Add Walk-in / Unknown</tspan><tspan x="95" dy="14">Attendee to Session</tspan>
      </text>
    </g>
    <g transform="translate(860, 680)">
      <ellipse cx="95" cy="25" rx="95" ry="25" fill="#FFF2CC" stroke="#D39E00" stroke-width="1.8" />
      <text x="95" y="21" text-anchor="middle" font-size="11" fill="#856404">
        <tspan x="95" dy="0">Inspect & Resolve</tspan><tspan x="95" dy="14">Sync Conflicts</tspan>
      </text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 725)">
    <rect x="0" y="0" width="160" height="65" rx="5" ry="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <ellipse cx="20" cy="18" rx="10" ry="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5" />
    <text x="38" y="22" font-size="10" font-weight="bold" fill="#001A4D">Base Use Case</text>
    <ellipse cx="20" cy="35" rx="10" ry="6" fill="#F8CECC" stroke="#D9383A" stroke-width="1.5" />
    <text x="38" y="39" font-size="10" fill="#900C3F">&lt;&lt;include&gt;&gt; Case</text>
    <ellipse cx="20" cy="52" rx="10" ry="6" fill="#FFF2CC" stroke="#D39E00" stroke-width="1.5" />
    <text x="38" y="56" font-size="10" fill="#856404">&lt;&lt;extend&gt;&gt; Case</text>
  </g>
</svg>